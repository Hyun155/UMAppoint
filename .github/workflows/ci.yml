name: UMAppoint CI

on:
  pull_request:
    branches: [main, fix/remove-obsolete-supabase-root-auth-listener]
  push:
    branches: [main, fix/remove-obsolete-supabase-root-auth-listener, feature/phase-c-lecturer-management]

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      VITE_API_URL: http://127.0.0.1:8002
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests
      - name: Run isolated Telegram integration tests
        working-directory: backend
        run: python -m pytest tests/test_telegram.py -q
